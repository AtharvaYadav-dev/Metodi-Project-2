; =============================================================================
; PlatformIO Project Configuration File
; Project: AeroTherm R&D - Phase 2 Hybrid EV Thermal Management System
; Target Architectures: ESP32 / STM32 (FreeRTOS-compatible C++14/17)
; =============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

; -----------------------------------------------------------------------------
; PRIMARY TARGET: ESP32-WROOM-32 / ESP32 Dev Module
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = time, default, esp32_exception_decoder

build_flags = 
    -std=gnu++17
    -Wall
    -Wextra
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_ESP32_WROOM

; -----------------------------------------------------------------------------
; SECONDARY TARGET: STM32 Nucleo-F401RE / FreeRTOS Ready
; -----------------------------------------------------------------------------
[env:nucleo_f401re]
platform = ststm32
board = nucleo_f401re
framework = arduino

monitor_speed = 115200
monitor_filters = time, default

build_flags = 
    -std=gnu++17
    -Wall
    -Wextra
    -D BOARD_STM32_NUCLEO
